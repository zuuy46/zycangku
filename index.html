<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<title>心理暗房 | 心理测试</title>
<style>
/* ========== 基础变量：指定专属色值 ========== */
:root {
  --darkroom-black: #14110D;
  --photo-paper: #EDE3CC;
  --safe-light-red: #C1432A; /* A 理性底片 */
  --developer-green: #3E6B5C; /* B 共情底片 */
  --fixing-gold: #B08D3E; /* C 随性底片 */
  --white: #ffffff;
}
/* 全局重置 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: var(--darkroom-black);
  color: var(--white);
  min-height: 100vh;
  padding: 24px 16px;
  background-image: radial-gradient(circle at 25% 15%, rgba(193, 67, 42, 0.06), transparent 24%),
  radial-gradient(circle at 75% 25%, rgba(62, 107, 92, 0.05), transparent 26%),
  radial-gradient(circle at 50% 85%, rgba(176, 141, 62, 0.04), transparent 28%),
  linear-gradient(180deg, #14110D 0%, #17130F 50%, #120F0C 100%);
  background-blend-mode: normal;
  background-attachment: fixed;
}
/* 字体定义 */
.title-font {
  font-family: "Noto Serif SC", serif;
  font-weight: 500;
}
.mono-font {
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.06em;
}
/* 页面视图切换 + 平滑过渡【修复】 */
.view {
  display: none;
  max-width: 520px;
  margin: 0 auto;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.view.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
}
/* ========== 首页样式 ========== */
.home-view {
  padding-top: 80px;
  text-align: center;
}
.home-view h1 {
  font-size: 2.2rem;
  color: var(--photo-paper);
  margin-bottom: 12px;
  text-shadow: 0 0 12px rgba(193, 67, 42, 0.35);
}
.home-view .subtitle {
  color: #b8b0a2;
  margin-bottom: 24px;
  font-size: 0.95rem;
}
.home-desc {
  text-align: left;
  border-left: 2px solid var(--safe-light-red);
  padding-left: 16px;
  margin-bottom: 20px;
  color: #c9c2b4;
  line-height: 1.7;
}
.dimension-desc {
  text-align: left;
  padding: 16px;
  background: rgba(255,255,255,0.03);
  margin-bottom: 40px;
  border-radius: 4px;
}
.dimension-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 0.9rem;
  line-height: 1.6;
}
.dimension-tag {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
}
.btn {
  background: transparent;
  border: 1px solid var(--safe-light-red);
  color: var(--safe-light-red);
  padding: 14px 32px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
  border-radius: 2px;
}
.btn:focus-visible {
  outline: 2px solid var(--safe-light-red);
  outline-offset: 3px;
}
.btn:hover {
  background-color: var(--safe-light-red);
  color: var(--darkroom-black);
}
/* ========== 答题页：曝光计进度条 ========== */
.question-view {
  padding-top: 40px;
}
.exposure-meter-wrap {
  margin-bottom: 32px;
}
.exposure-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.exposure-meter {
  height: 6px;
  background: rgba(255,255,255,0.1);
  position: relative;
  border-radius: 3px;
  overflow:hidden;
}
.exposure-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#992c1b,var(--safe-light-red));
  transition: width 0.4s ease;
}
.frame-number {
  color: var(--fixing-gold);
  margin-bottom: 20px;
}
.question-title {
  font-size: 1.4rem;
  line-height: 1.6;
  margin-bottom: 28px;
}
.option-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-item {
  border: 1px solid rgba(237, 227, 204, 0.25);
  padding: 16px;
  cursor: pointer;
  transition: 0.2s;
  border-radius: 2px;
}
.option-item:focus-visible {
  outline: 2px solid var(--safe-light-red);
  outline-offset: 3px;
}
.option-item:hover {
  border-color: var(--safe-light-red);
  background: rgba(193, 67, 42, 0.08);
}
.option-item.selected{
  border-color: var(--safe-light-red);
  background: rgba(193, 67, 42, 0.18);
  transform: scale(0.98);
}
/* ========== 显影加载页 ========== */
.develop-view {
  padding-top: 100px;
  text-align: center;
  position:relative;
  overflow:hidden;
}
.develop-text {
  color: var(--photo-paper);
  margin-bottom: 24px;
}
.develop-loader {
  width: 120px;
  height: 4px;
  background: rgba(237, 227, 204, 0.15);
  margin: 0 auto;
  overflow: hidden;
}
.develop-bar {
  height: 100%;
  width: 30%;
  background: var(--developer-green);
  animation: developAnim 1.8s ease-in-out infinite;
}
@keyframes developAnim {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(300%); }
}
.develop-view::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(193,67,42,0.12),transparent);
  animation: sweepLight 2s ease-in-out infinite;
}
@keyframes sweepLight {
  0%{left:-100%;}
  100%{left:100%;}
}
/* ========== 结果页：冲印照片卡片 ========== */
.result-view {
  padding-top: 40px;
}
.photo-card {
  background-color: var(--photo-paper);
  color: var(--darkroom-black);
  padding: 32px 24px;
  position: relative;
  transform: rotate(-1.2deg) scale(0.95);
  opacity:0;
  animation: cardPop 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  max-width: 480px;
  margin: 0 auto;
}
@keyframes cardPop{
  to{ transform: rotate(-1.2deg) scale(1); opacity:1; }
}
/* 照片四角卡角装饰 */
.photo-card::before, .photo-card::after, .photo-card .corner-1, .photo-card .corner-2 {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  border: 2px solid var(--darkroom-black);
  border-radius: 1px;
}
.photo-card::before { top: 10px; left:10px; border-right: none; border-bottom: none; }
.photo-card::after { top:10px; right:10px; border-left: none; border-bottom: none; }
.photo-card .corner-1 { bottom:10px; left:10px; border-right: none; border-top: none; }
.photo-card .corner-2 { bottom:10px; right:10px; border-left: none; border-top: none; }

/*===== 人格SVG动画图案 =====*/
.result-symbol {
  width: 120px;
  height: 120px;
  margin: 0 auto 20px;
  position: relative;
}
.result-symbol .symbol {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.result-symbol .symbol.active {
  opacity: 1;
  transform: scale(1);
}
/* A理性 光圈扫描 */
.symbol-rational .scan-ring {
  transform-origin: center;
  animation: scanPulse 2.4s ease-in-out infinite;
}
@keyframes scanPulse {
  0% { transform: scale(0.7); opacity: .8; }
  50% { transform: scale(1.08); opacity: .25; }
  100% { transform: scale(0.7); opacity: .8; }
}
/* B共情 心跳波纹 */
.symbol-empathy .heart-wave {
  transform-origin: center;
  animation: heartWave 2.6s ease-in-out infinite;
}
.symbol-empathy .heart-wave:nth-child(2) { animation-delay: .3s; }
.symbol-empathy .heart-wave:nth-child(3) { animation-delay: .6s; }
.symbol-empathy .heart-core { animation: heartBeat 1.4s ease-in-out infinite; }
@keyframes heartWave {
  0%,100% { transform: scale(1); opacity: .7; }
  50% { transform: scale(1.06); opacity: 1; }
}
@keyframes heartBeat {
  0%,100% { transform: scale(1); }
  25% { transform: scale(1.18); }
  50% { transform: scale(1); }
  75% { transform: scale(1.12); }
}
/* C随性 胶片流动 */
.symbol-carefree .film-path {
  stroke-dasharray: 120;
  stroke-dashoffset: 120;
  animation: filmFlow 2.8s ease-in-out infinite;
}
@keyframes filmFlow {
  0% { stroke-dashoffset: 120; opacity: .3; }
  40% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: -120; opacity: .3; }
}
/* AB混合型 */
.symbol-ab { animation: abFloat 3s ease-in-out infinite; }
@keyframes abFloat {
  0%,100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.04) translateY(-4px); }
}
/* AC混合型 */
.symbol-ac { animation: acRotate 8s linear infinite; }
@keyframes acRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
/* BC混合型 */
.symbol-bc { animation: bcBreath 3s ease-in-out infinite; }
@keyframes bcBreath {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
/* ABC均衡型 */
.symbol-abc circle {
  transform-origin: center;
  animation: abcExpand 3s ease-in-out infinite;
}
.symbol-abc circle:nth-child(2) { animation-delay: .2s; }
.symbol-abc circle:nth-child(3) { animation-delay: .4s; }
.symbol-abc circle:nth-child(4) { animation-delay: .6s; }
@keyframes abcExpand {
  0%,100% { transform: scale(1); opacity: .55; }
  50% { transform: scale(1.08); opacity: .9; }
}

.result-title {
  font-size: 1.7rem;
  margin-bottom: 16px;
  text-align:center;
}
.result-desc {
  line-height: 1.7;
  margin-bottom: 28px;
}
.data-group {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap:14px;
}
.data-item {
  display:flex;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(20,17,13,0.1);
  align-items:center;
}
.data-item:last-child { border: none; }
.data-dot{
  width:10px;
  height:10px;
  border-radius:2px;
  display:inline-block;
  margin-right:6px;
}
.data-1 { color: var(--safe-light-red); font-weight: 500; }
.data-2 { color: var(--developer-green); font-weight: 500; }
.data-3 { color: var(--fixing-gold); font-weight: 500; }
/*百分比进度条*/
.percent-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.percent-bar {
  width: 80px;
  height: 4px;
  background: rgba(20,17,13,0.12);
  border-radius: 2px;
  overflow: hidden;
}
.percent-bar span {
  display: block;
  height: 100%;
  width: 0;
  transition: width 0.8s ease;
}
.data-1 .percent-bar span { background: var(--safe-light-red); }
.data-2 .percent-bar span { background: var(--developer-green); }
.data-3 .percent-bar span { background: var(--fixing-gold); }

/* SVG 鉴定印章，延迟0.5s弹入，冲压动画 */
.stamp-wrap {
  position: absolute;
  right: 12px;
  bottom: 12px;
  width: 110px;
  height: 110px;
  opacity:0;
  transform: scale(1.6);
  transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events:none;
}
.stamp-wrap.active {
  opacity: 1;
  transform: scale(1);
}
.restart-btn-wrap {
  margin-top:40px;
  text-align:center;
}
/* 减少动画适配 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
/* 移动端360px适配 */
@media (max-width:360px) {
  body { padding:16px 12px; }
  .photo-card { padding:24px 16px; }
  .result-title { font-size:1.4rem; }
}
</style>
<!-- 字体预加载 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<!-- 首页视图 -->
<div class="view home-view active" id="home">
  <h1 class="title-font">心理暗房</h1>
  <p class="subtitle mono-font">PSYCHO DARKROOM · 曝光你的心理底片</p>
  <div class="home-desc">
    <p>心理如同未曝光的胶片。</p>
    <p>每一道问题，都是一次精准曝光。</p>
    <p>完成10道底片测试，解锁你的专属心理人格画像。</p>
  </div>
  <div class="dimension-desc">
    <div class="dimension-item">
      <span class="dimension-tag" style="background: var(--safe-light-red);"></span>
      <span><strong>理性底片</strong>：冷静克制、逻辑优先、擅长掌控秩序与节奏</span>
    </div>
    <div class="dimension-item">
      <span class="dimension-tag" style="background: var(--developer-green);"></span>
      <span><strong>共情底片</strong>：细腻敏感、擅长共情、包容他人情绪与感受</span>
    </div>
    <div class="dimension-item">
      <span class="dimension-tag" style="background: var(--fixing-gold);"></span>
      <span><strong>随性底片</strong>：松弛自由、适应性强、不被规则与执念束缚</span>
    </div>
  </div>
  <button class="btn mono-font" id="startBtn">开始曝光测试</button>
</div>

<!-- 答题视图 -->
<div class="view question-view" id="question">
  <div class="exposure-meter-wrap">
    <div class="exposure-label mono-font">
      <span>曝光计</span>
      <span id="progressText">0 / 10</span>
    </div>
    <div class="exposure-meter">
      <div class="exposure-fill" id="exposureFill"></div>
    </div>
  </div>
  <p class="frame-number mono-font" id="frameNo">胶片帧 #01</p>
  <h2 class="question-title title-font" id="questionText"></h2>
  <div class="option-list" id="optionList"></div>
</div>

<!-- 显影加载视图 -->
<div class="view develop-view" id="develop">
  <p class="develop-text title-font">正在显影底片...</p>
  <div class="develop-loader">
    <div class="develop-bar"></div>
  </div>
  <p class="mono-font" style="margin-top:16px;color:#aaa;">等待冲印心理鉴定报告</p>
</div>

<!-- 结果视图 -->
<div class="view result-view" id="result">
  <div class="photo-card">
    <span class="corner-1"></span>
    <span class="corner-2"></span>

    <!-- 人格专属动画SVG图案 -->
    <div class="result-symbol" id="resultSymbol">
      <!-- A理性底片：光圈扫描 -->
      <svg class="symbol symbol-rational" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="46" fill="none" stroke="#C1432A" stroke-width="1.6" opacity=".4" />
        <circle cx="60" cy="60" r="34" fill="none" stroke="#C1432A" stroke-width="1.6" opacity=".55" />
        <circle cx="60" cy="60" r="22" fill="none" stroke="#C1432A" stroke-width="1.8" />
        <circle cx="60" cy="60" r="8" fill="#C1432A" />
        <line x1="60" y1="4" x2="60" y2="18" stroke="#C1432A" stroke-width="1.6" />
        <line x1="60" y1="102" x2="60" y2="116" stroke="#C1432A" stroke-width="1.6" />
        <line x1="4" y1="60" x2="18" y2="60" stroke="#C1432A" stroke-width="1.6" />
        <line x1="102" y1="60" x2="116" y2="60" stroke="#C1432A" stroke-width="1.6" />
        <circle class="scan-ring" cx="60" cy="60" r="50" fill="none" stroke="#C1432A" stroke-width="2" />
      </svg>
      <!-- B共情底片：心形波纹 -->
      <svg class="symbol symbol-empathy" viewBox="0 0 120 120" aria-hidden="true">
        <path class="heart-wave" d="M20 62 C20 42 40 34 60 50 C80 34 100 42 100 62 C100 82 76 96 60 104 C44 96 20 82 20 62 Z" fill="none" stroke="#3E6B5C" stroke-width="1.8" />
        <path class="heart-wave" d="M30 60 C30 46 46 40 60 52 C74 40 90 46 90 60 C90 74 72 86 60 92 C48 86 30 74 30 60 Z" fill="none" stroke="#3E6B5C" stroke-width="1.6" />
        <path class="heart-wave" d="M40 58 C40 48 52 44 60 54 C68 44 80 48 80 58 C80 68 68 78 60 82 C52 78 40 68 40 58 Z" fill="none" stroke="#3E6B5C" stroke-width="1.6" />
        <path class="heart-core" d="M52 56 C52 52 56 50 60 54 C64 50 68 52 68 56 C68 62 62 68 60 70 C58 68 52 62 52 56 Z" fill="#3E6B5C" />
      </svg>
      <!-- C随性底片：胶片帧流动 -->
      <svg class="symbol symbol-carefree" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="14" y="30" width="92" height="60" rx="4" fill="none" stroke="#B08D3E" stroke-width="1.8" />
        <rect x="22" y="38" width="76" height="44" rx="2" fill="none" stroke="#B08D3E" stroke-width="1.4" />
        <circle cx="30" cy="44" r="2" fill="#B08D3E" />
        <circle cx="42" cy="44" r="2" fill="#B08D3E" />
        <circle cx="78" cy="44" r="2" fill="#B08D3E" />
        <circle cx="90" cy="44" r="2" fill="#B08D3E" />
        <circle cx="30" cy="76" r="2" fill="#B08D3E" />
        <circle cx="42" cy="76" r="2" fill="#B08D3E" />
        <circle cx="78" cy="76" r="2" fill="#B08D3E" />
        <circle cx="90" cy="76" r="2" fill="#B08D3E" />
        <path class="film-path" d="M18 60 C30 44 46 76 60 52 C74 28 90 76 102 60" fill="none" stroke="#B08D3E" stroke-width="2" stroke-linecap="round" />
      </svg>
      <!-- AB：理性+共情 -->
      <svg class="symbol symbol-ab" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="48" fill="none" stroke="#C1432A" stroke-width="1.4" opacity=".5" />
        <circle cx="60" cy="60" r="36" fill="none" stroke="#C1432A" stroke-width="1.4" opacity=".6" />
        <path d="M36 64 C36 50 48 44 60 54 C72 44 84 50 84 64 C84 78 70 88 60 94 C50 88 36 78 36 64 Z" fill="none" stroke="#3E6B5C" stroke-width="1.8" />
        <circle cx="60" cy="60" r="6" fill="#C1432A" />
        <circle cx="60" cy="60" r="3" fill="#3E6B5C" />
      </svg>
      <!-- AC：理性+随性 -->
      <svg class="symbol symbol-ac" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="46" fill="none" stroke="#C1432A" stroke-width="1.4" opacity=".45" />
        <circle cx="60" cy="60" r="34" fill="none" stroke="#C1432A" stroke-width="1.4" opacity=".55" />
        <rect x="24" y="44" width="72" height="32" rx="3" fill="none" stroke="#B08D3E" stroke-width="1.8" />
        <circle cx="60" cy="60" r="8" fill="#B08D3E" />
        <circle cx="60" cy="60" r="4" fill="#C1432A" />
      </svg>
      <!-- BC：共情+随性 -->
      <svg class="symbol symbol-bc" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M28 62 C28 46 44 40 60 52 C76 40 92 46 92 62 C92 78 76 90 60 96 C44 90 28 78 28 62 Z" fill="none" stroke="#3E6B5C" stroke-width="1.6" />
        <rect x="20" y="36" width="80" height="48" rx="4" fill="none" stroke="#B08D3E" stroke-width="1.4" opacity=".7" />
        <path d="M44 62 C44 54 52 50 60 58 C68 50 76 54 76 62 C76 70 68 78 60 82 C52 78 44 70 44 62 Z" fill="#3E6B5C" />
      </svg>
      <!-- ABC均衡底片 -->
      <svg class="symbol symbol-abc" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="48" fill="none" stroke="#C1432A" stroke-width="1.4" opacity=".4" />
        <circle cx="60" cy="60" r="38" fill="none" stroke="#3E6B5C" stroke-width="1.4" opacity=".5" />
        <circle cx="60" cy="60" r="28" fill="none" stroke="#B08D3E" stroke-width="1.4" opacity=".6" />
        <circle cx="60" cy="60" r="18" fill="none" stroke="#C1432A" stroke-width="1.4" opacity=".7" />
        <circle cx="60" cy="60" r="8" fill="#3E6B5C" />
        <circle cx="60" cy="60" r="3" fill="#B08D3E" />
      </svg>
    </div>

    <h2 class="result-title title-font" id="resultTitle"></h2>
    <p class="result-desc" id="resultDesc"></p>

    <div class="data-group mono-font">
      <div class="data-item data-1">
        <span><span class="data-dot" style="background:var(--safe-light-red)"></span>理性底片</span>
        <div class="percent-wrap">
          <div class="percent-bar"><span id="barA"></span></div>
          <span id="percentA">--</span>
        </div>
      </div>
      <div class="data-item data-2">
        <span><span class="data-dot" style="background:var(--developer-green)"></span>共情底片</span>
        <div class="percent-wrap">
          <div class="percent-bar"><span id="barB"></span></div>
          <span id="percentB">--</span>
        </div>
      </div>
      <div class="data-item data-3">
        <span><span class="data-dot" style="background:var(--fixing-gold)"></span>随性底片</span>
        <div class="percent-wrap">
          <div class="percent-bar"><span id="barC"></span></div>
          <span id="percentC">--</span>
        </div>
      </div>
    </div>

    <!-- SVG弧线文字鉴定印章 -->
    <div class="stamp-wrap" id="stamp">
      <svg viewBox="0 0 100 100">
        <path id="circlePath" fill="none" d="M 50,50 m -42,0 a 42,42 0 1,1 84,0 a 42,42 0 1,1 -84,0"/>
        <text font-size="10" fill="#C1432A">
          <textPath href="#circlePath">心理暗房 · 鉴定有效</textPath>
        </text>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#C1432A" stroke-width="2"/>
      </svg>
    </div>
  </div>
  <div class="restart-btn-wrap">
    <button class="btn mono-font" id="restartBtn">重新拍摄底片</button>
  </div>
</div>

<script>
// 10道测试题目
const questions = [
  { frame: "#01", q: "面对突发意外打乱计划，你会？", options: [
    { text: "立刻梳理问题，快速制定新方案", score:{A:2,B:0,C:1} },
    { text: "担心影响他人，优先照顾别人感受", score:{A:0,B:2,C:1} },
    { text: "顺其自然，接受变化、随心调整", score:{A:1,B:0,C:2} }
  ] },
  { frame: "#02", q: "与人产生分歧时，你的处事方式是？", options: [
    { text: "讲道理摆逻辑，对错优先", score:{A:2,B:0,C:1} },
    { text: "换位思考，主动包容化解矛盾", score:{A:0,B:2,C:1} },
    { text: "懒得争执，随对方想法即可", score:{A:1,B:0,C:2} }
  ] },
  { frame: "#03", q: "空闲独处时，你更享受哪种状态？", options: [
    { text: "复盘梳理生活、规划后续事务", score:{A:2,B:1,C:0} },
    { text: "沉浸情绪、治愈自我、放空内心", score:{A:1,B:2,C:0} },
    { text: "随心所欲躺平、无目的放松", score:{A:0,B:1,C:2} }
  ] },
  { frame: "#04", q: "做重大决定时，你更依赖？", options: [
    { text: "数据、经验、逻辑推演", score:{A:2,B:0,C:1} },
    { text: "内心感受、直觉与本心", score:{A:0,B:2,C:1} },
    { text: "随缘选择、不纠结不内耗", score:{A:1,B:0,C:2} }
  ] },
  { frame: "#05", q: "看到他人难过低落，你会？", options: [
    { text: "理性分析原因，给出解决办法", score:{A:2,B:1,C:0} },
    { text: "感同身受，主动安慰陪伴", score:{A:1,B:2,C:0} },
    { text: "保持距离，不主动介入情绪", score:{A:0,B:1,C:2} }
  ] },
  { frame: "#06", q: "对待生活规则与约束，你的态度？", options: [
    { text: "严格遵守，敬畏秩序、自律性强", score:{A:2,B:0,C:1} },
    { text: "灵活变通，兼顾人情与规则", score:{A:1,B:2,C:0} },
    { text: "不喜束缚，随心而为", score:{A:0,B:1,C:2} }
  ] },
  { frame: "#07", q: "遭遇压力挫折，你会如何应对？", options: [
    { text: "冷静抗压，独自解决问题", score:{A:2,B:0,C:1} },
    { text: "情绪敏感，需要他人安抚", score:{A:0,B:2,C:1} },
    { text: "转移注意力，快速释怀放下", score:{A:1,B:0,C:2} }
  ] },
  { frame: "#08", q: "与人交往中，你更偏向？", options: [
    { text: "边界清晰，理性社交、分寸感强", score:{A:2,B:1,C:0} },
    { text: "温柔待人，在意他人情绪体验", score:{A:1,B:2,C:0} },
    { text: "松弛随性，不刻意维系关系", score:{A:0,B:1,C:2} }
  ] },
  { frame: "#09", q: "对待未来生活，你的心态是？", options: [
    { text: "提前规划，稳步推进、掌控未来", score:{A:2,B:0,C:1} },
    { text: "心怀温柔，期待美好、随遇而安", score:{A:0,B:2,C:1} },
    { text: "活在当下，享受即时快乐", score:{A:1,B:0,C:2} }
  ] },
  { frame: "#10", q: "面对遗憾与过错，你会？", options: [
    { text: "复盘总结，避免再次犯错", score:{A:2,B:1,C:0} },
    { text: "内心纠结，久久难以释怀", score:{A:1,B:2,C:0} },
    { text: "坦然接纳，翻篇不再执念", score:{A:0,B:1,C:2} }
  ] }
];

// 结果库
const resultPool = [
  { key: "A", title: "底片人格：理性思辨者", desc: "你的核心底色是理性与秩序。你拥有极强的逻辑思维和情绪自控力，遇事冷静不慌乱，擅长梳理问题、规划人生、掌控节奏。你做事分寸感十足，不被情绪左右，但偶尔会过于克制自我，忽略内心真实感受。是团队与生活中最靠谱的定心丸。" },
  { key: "B", title: "底片人格：温柔共情者", desc: "你的核心底色是细腻与善意。你拥有超高的情绪感知力，能敏锐捕捉他人的情绪变化，擅长换位思考、包容他人。内心柔软、待人温柔，极具治愈力。但容易过度内耗、被他人情绪裹挟，常常委屈自己成全他人，需要学会自我保护。" },
  { key: "C", title: "底片人格：松弛随性者", desc: "你的核心底色是自由与洒脱。你适应性极强，心态松弛通透，不被规则、执念、他人眼光束缚。活得真实自在，擅长快速消化负面情绪、翻篇过往。但偶尔过于佛系松弛，容易缺乏规划性，出现拖延、目标摇摆的情况。" },
  { key: "AB", title: "底片人格：理性共情者", desc: "理性与共情在你身上均衡共存。你既能冷静分析问题，又能体察他人情绪。遇事可以兼顾道理与人情，很擅长平衡现实与感受。但也更容易陷入两难，一边理智判断，一边共情别人，内心消耗会更大。" },
  { key: "AC", title: "底片人格：自由规划者", desc: "你拥有理性的思考能力，同时又向往自由。你可以做好规划，但拒绝死板束缚。有目标但不会被计划绑架，懂得灵活调整。但有时会在自律和躺平之间反复摇摆。" },
  { key: "BC", title: "底片人格：温柔自由者", desc: "共情力强，又向往松弛自在。你能感知他人情绪，但不会被他人长期捆绑。待人柔软，同时懂得给自己留空间。缺点是遇到重大抉择时，容易凭感受选择，缺少长远规划。" },
  { key: "ABC", title: "底片人格：均衡底片", desc: "三维度发展均衡，适应性极强。在不同场景下切换理性、共情、松弛三种状态。能理性做事，能共情他人，也懂得适时放下。但不容易形成固定风格，偶尔会出现选择困难。" }
];

// 视图DOM
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const homeView = $("#home");
const questionView = $("#question");
const developView = $("#develop");
const resultView = $("#result");

let currentIndex = 0;
let score = {A:0,B:0,C:0};
let isAnswering = false;

function switchView(el) {
  $$(".view").forEach(v=>v.classList.remove("active"));
  requestAnimationFrame(()=>{
    el.classList.add("active");
  })
}

// 开始测试
$("#startBtn").onclick = ()=>{
  currentIndex = 0;
  score = {A:0,B:0,C:0};
  renderQuestion();
  switchView(questionView);
}

// 渲染单题
function renderQuestion() {
  const item = questions[currentIndex];
  $("#frameNo").textContent = `胶片帧 ${item.frame}`;
  $("#questionText").textContent = item.q;
  $("#progressText").textContent = `${currentIndex+1} / ${questions.length}`;
  $("#exposureFill").style.width = `${((currentIndex+1)/questions.length)*100}%`;
  const optWrap = $("#optionList");
  optWrap.innerHTML = "";
  item.options.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "option-item";
    div.tabIndex = 0;
    div.textContent = opt.text;
    div.onclick = ()=> selectAnswer(opt.score);
    div.onkeydown = (e)=>{
      if(e.key === "Enter") selectAnswer(opt.score);
    }
    optWrap.appendChild(div);
  })
  isAnswering = false;
}

// 选择答案计分（防抖）
function selectAnswer(s) {
  if(isAnswering) return;
  isAnswering = true;
  score.A += s.A;
  score.B += s.B;
  score.C += s.C;
  currentIndex++;
  if(currentIndex >= questions.length) {
    switchView(developView);
    setTimeout(()=>{
      renderResult();
      switchView(resultView);
      setTimeout(()=> $("#stamp").classList.add("active"),500);
    },2000);
  } else {
    renderQuestion();
  }
}

// 渲染结果：百分比+进度条+切换SVG动画图案
function renderResult() {
  $("#stamp").classList.remove("active");
  // 隐藏全部SVG图案
  $$(".result-symbol .symbol").forEach(el => el.classList.remove("active"));

  const maxSort = Object.entries(score).sort((a,b)=>b[1]-a[1]);
  const top1Val = maxSort[0][1];
  const top2Val = maxSort[1][1];
  const top3Val = maxSort[2][1];
  let resultKey = "";
  const threshold = 2;
  if(Math.abs(top1Val - top2Val) <= threshold) {
    if(Math.abs(top2Val - top3Val) <= threshold){
      resultKey = "ABC";
    }else{
      resultKey = maxSort[0][0] + maxSort[1][0];
    }
  }else{
    resultKey = maxSort[0][0];
  }
  const res = resultPool.find(item => item.key === resultKey);
  $("#resultTitle").textContent = res.title;
  $("#resultDesc").textContent = res.desc;

  // 计算百分比
  const total = score.A + score.B + score.C || 1;
  const percentA = Math.round((score.A / total) * 100);
  const percentB = Math.round((score.B / total) * 100);
  const percentC = Math.round((score.C / total) * 100);

  $("#percentA").textContent = percentA + "%";
  $("#percentB").textContent = percentB + "%";
  $("#percentC").textContent = percentC + "%";

  // 进度条动画
  $("#barA").style.width = percentA + "%";
  $("#barB").style.width = percentB + "%";
  $("#barC").style.width = percentC + "%";

  // 激活对应人格SVG动画
  const symbolMap = {
    "A": "symbol-rational",
    "B": "symbol-empathy",
    "C": "symbol-carefree",
    "AB": "symbol-ab",
    "AC": "symbol-ac",
    "BC": "symbol-bc",
    "ABC": "symbol-abc"
  };
  const targetSymbol = document.querySelector("." + symbolMap[resultKey]);
  if(targetSymbol){
    setTimeout(()=>{
      targetSymbol.classList.add("active");
    },300);
  }
}

// 重新测试
$("#restartBtn").onclick = ()=>{
  switchView(homeView);
}
</script>
</body>
</html>
