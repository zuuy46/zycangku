<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<title>心理暗房 | 心理测试</title>
<style>
:root {
  --darkroom-black: #14110D;
  --photo-paper: #EDE3CC;
  --safe-light-red: #C1432A;
  --developer-green: #3E6B5C;
  --fixing-gold: #B08D3E;
  --white: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: var(--darkroom-black);
  color: var(--white);
  min-height: 100vh;
  padding: 24px 16px;
  background-image:
    radial-gradient(circle at 25% 15%, rgba(193, 67, 42, 0.06), transparent 24%),
    radial-gradient(circle at 75% 25%, rgba(62, 107, 92, 0.05), transparent 26%),
    radial-gradient(circle at 50% 85%, rgba(176, 141, 62, 0.04), transparent 28%),
    linear-gradient(180deg, #14110D 0%, #17130F 50%, #120F0C 100%);
  background-attachment: fixed;
}

.title-font { font-family: "Noto Serif SC", serif; font-weight: 500; }
.mono-font { font-family: "JetBrains Mono", monospace; letter-spacing: 0.06em; }

.view {
  display: none; max-width: 520px; margin: 0 auto;
  opacity: 0; transform: translateY(12px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.view.active { display: block; opacity: 1; transform: translateY(0); }

.home-view { padding-top: 80px; text-align: center; }
.home-view h1 {
  font-size: 2.2rem; color: var(--photo-paper); margin-bottom: 12px;
  text-shadow: 0 0 12px rgba(193, 67, 42, 0.35);
}
.home-view .subtitle { color: #b8b0a2; margin-bottom: 24px; font-size: 0.95rem; }
.home-desc {
  text-align: left; border-left: 2px solid var(--safe-light-red);
  padding-left: 16px; margin-bottom: 20px; color: #c9c2b4; line-height: 1.7;
}
.dimension-desc {
  text-align: left; padding: 16px; background: rgba(255,255,255,0.03);
  margin-bottom: 40px; border-radius: 4px;
}
.dimension-item {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px; font-size: 0.9rem; line-height: 1.6;
}
.dimension-tag { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

.btn {
  background: transparent; border: 1px solid var(--safe-light-red);
  color: var(--safe-light-red); padding: 14px 32px; font-size: 1rem;
  cursor: pointer; transition: all 0.2s ease; border-radius: 2px;
}
.btn:focus-visible { outline: 2px solid var(--safe-light-red); outline-offset: 3px; }
.btn:hover { background-color: var(--safe-light-red); color: var(--darkroom-black); }

.question-view { padding-top: 40px; }
.exposure-meter-wrap { margin-bottom: 32px; }
.exposure-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
.exposure-meter {
  height: 6px; background: rgba(255,255,255,0.1);
  position: relative; border-radius: 3px; overflow: hidden;
}
.exposure-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg,#992c1b,var(--safe-light-red));
  transition: width 0.4s ease;
}
.frame-number { color: var(--fixing-gold); margin-bottom: 20px; }
.question-title { font-size: 1.4rem; line-height: 1.6; margin-bottom: 28px; }

.option-list { display: flex; flex-direction: column; gap: 12px; }
.option-item {
  border: 1px solid rgba(237, 227, 204, 0.25); padding: 16px;
  cursor: pointer; transition: 0.2s; border-radius: 2px;
}
.option-item:focus-visible { outline: 2px solid var(--safe-light-red); outline-offset: 3px; }
.option-item:hover { border-color: var(--safe-light-red); background: rgba(193, 67, 42, 0.08); }
.option-item.selected {
  border-color: var(--safe-light-red); background: rgba(193, 67, 42, 0.18); transform: scale(0.98);
}

.develop-view { padding-top: 100px; text-align: center; position: relative; overflow: hidden; }
.develop-text { color: var(--photo-paper); margin-bottom: 24px; }
.develop-loader {
  width: 120px; height: 4px; background: rgba(237, 227, 204, 0.15);
  margin: 0 auto; overflow: hidden;
}
.develop-bar {
  height: 100%; width: 30%; background: var(--developer-green);
  animation: developAnim 1.8s ease-in-out infinite;
}
@keyframes developAnim {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(300%); }
}
.develop-view::after {
  content: ""; position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg,transparent,rgba(193,67,42,0.12),transparent);
  animation: sweepLight 2s ease-in-out infinite;
}
@keyframes sweepLight {
  0% { left: -100%; }
  100% { left: 100%; }
}

.result-view { padding-top: 40px; }

/* ===== 拍立得底片卡 ===== */
.photo-card {
  background-color: var(--photo-paper);
  color: var(--darkroom-black);
  padding: 28px 24px 28px;
  position: relative;
  transform: rotate(-1.2deg) scale(0.95);
  opacity: 0;
  animation: cardPop 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  max-width: 480px;
  margin: 0 auto;
}
@keyframes cardPop { to { transform: rotate(-1.2deg) scale(1); opacity: 1; } }

.photo-card::before, .photo-card::after,
.photo-card .corner-1, .photo-card .corner-2 {
  content: ""; position: absolute; width: 24px; height: 24px;
  border: 2px solid var(--darkroom-black); border-radius: 1px;
}
.photo-card::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
.photo-card::after { top: 10px; right: 10px; border-left: none; border-bottom: none; }
.photo-card .corner-1 { bottom: 10px; left: 10px; border-right: none; border-top: none; }
.photo-card .corner-2 { bottom: 10px; right: 10px; border-left: none; border-top: none; }

/* ===== 角色舞台 ===== */
.character-area {
  position: relative;
  width: 100%;
  max-width: 260px;
  aspect-ratio: 1 / 1;
  margin: 0 auto 20px;
  border-radius: 6px;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.7) translateY(10px);
  animation: stageIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.25s forwards;
  background:
    radial-gradient(circle at 50% 118%, var(--ch-b, #FFE3C6) 0%, transparent 62%),
    linear-gradient(168deg, var(--ch-a, #FFF3DF) 0%, #F6E7CE 58%, #EFDCC0 100%);
}
@keyframes stageIn { to { opacity: 1; transform: scale(1) translateY(0); } }
.character-area::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 40%, transparent 52%, rgba(20,17,13,0.14) 100%);
  pointer-events: none;
}
.character-area svg { width: 100%; height: 100%; display: block; }

/* 常见动漫元素：星芒 / 花瓣 / 流光（延迟用内联 style 控制，避免 nth-of-type 失效） */
.ch-sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle {
  0%, 100% { opacity: .15; transform: scale(.6) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
}
/* 大四芒星：呼吸式闪亮 */
.ch-star { transform-box: fill-box; transform-origin: center; animation: starPulse 3.2s ease-in-out infinite; }
@keyframes starPulse {
  0%, 100% { opacity: .25; transform: scale(.72) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(18deg); }
}
/* 花瓣：从上方飘落，带横向摆动 */
.ch-petal { transform-box: fill-box; transform-origin: center; animation: petalFall 6s linear infinite; }
@keyframes petalFall {
  0% { transform: translate(0, -26px) rotate(0deg); opacity: 0; }
  12% { opacity: .85; }
  55% { transform: translate(-11px, 34px) rotate(180deg); }
  85% { opacity: .85; }
  100% { transform: translate(6px, 84px) rotate(340deg); opacity: 0; }
}
/* 背景光晕：缓慢明暗 + 轻微缩放 */
.ch-aurora { transform-box: fill-box; transform-origin: center; animation: aurora 6s ease-in-out infinite; }
@keyframes aurora {
  0%, 100% { opacity: .2; transform: scale(1); }
  50% { opacity: .58; transform: scale(1.1); }
}
/* 环绕光环：缓慢旋转 */
.ch-orbit { transform-box: fill-box; transform-origin: center; animation: orbit 14s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }

/* 呼吸 / 眨眼 / 漂浮 */
.ch-breathe { transform-box: fill-box; transform-origin: center bottom; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-2.5px) scale(1.012); }
}
/* 整体漂浮：上下 + 轻微侧倾（多关键帧更自然） */
.ch-float { transform-box: fill-box; transform-origin: center; animation: floaty 5.6s ease-in-out infinite; }
@keyframes floaty {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(-5px) rotate(-1.4deg); }
  65% { transform: translateY(-1.5px) rotate(1.2deg); }
}
/* 发丝飘动：左右不对称、幅度错开 */
.ch-hair { transform-box: fill-box; transform-origin: 50% 0%; animation: hairSway 4.6s ease-in-out infinite; }
.ch-hair.r { animation-name: hairSwayR; }
@keyframes hairSway {
  0%, 100% { transform: rotate(0deg) skewX(0deg); }
  35% { transform: rotate(-3.2deg) skewX(-2deg); }
  70% { transform: rotate(-1.2deg) skewX(-.6deg); }
}
@keyframes hairSwayR {
  0%, 100% { transform: rotate(0deg) skewX(0deg); }
  35% { transform: rotate(3.2deg) skewX(2deg); }
  70% { transform: rotate(1.2deg) skewX(.6deg); }
}
/* 长卷发：末端额外摆动 */
.ch-hair-tip { transform-box: fill-box; transform-origin: 50% 0%; animation: tipSway 3.8s ease-in-out infinite; }
@keyframes tipSway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(4deg); }
}
/* 眨眼：不规则节奏（两次快眨 + 长间隔），更像真人 */
.ch-blink { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink {
  0%, 4.5% { transform: scaleY(1); }
  5.6% { transform: scaleY(0.06); }
  6.7%, 8.2% { transform: scaleY(1); }
  9.3% { transform: scaleY(0.06); }
  10.4%, 100% { transform: scaleY(1); }
}
/* 眼睛整体：缓慢上下浮动（视线游移感） */
.ch-eyes { transform-box: fill-box; transform-origin: center; animation: eyeDrift 6.5s ease-in-out infinite; }
@keyframes eyeDrift {
  0%, 100% { transform: translate(0, 0); }
  30% { transform: translate(1.1px, -0.7px); }
  65% { transform: translate(-1.1px, 0.5px); }
}
/* 腮红：明暗呼吸 + 轻微涨缩 */
.ch-cheek { transform-box: fill-box; transform-origin: center; animation: cheekGlow 3.4s ease-in-out infinite; }
@keyframes cheekGlow {
  0%, 100% { opacity: .4; transform: scale(.94); }
  50% { opacity: .82; transform: scale(1.06); }
}
/* 发丝高光：缓慢掠过 */
.ch-shine { animation: shineShift 4.4s ease-in-out infinite; }
@keyframes shineShift {
  0%, 100% { opacity: .26; transform: translateX(0); }
  50% { opacity: .5; transform: translateX(4px); }
}
/* 配饰：轻晃（马尾 / 光环 / 叶子） */
.ch-accent { transform-box: fill-box; transform-origin: 50% 90%; animation: accentBob 4s ease-in-out infinite; }
@keyframes accentBob {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(-2.4deg) translateY(-2.5px); }
}
/* 腮红/装饰后的整体呼吸光 */
.ch-glowpulse { animation: glowPulse 4.8s ease-in-out infinite; }
@keyframes glowPulse {
  0%, 100% { opacity: .1; transform: scale(1); }
  50% { opacity: .26; transform: scale(1.06); }
}

.percent-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px; }
.percent-item { display: flex; align-items: center; gap: 12px; }
.percent-label { width: 86px; font-size: 0.9rem; font-weight: 500; flex-shrink: 0; }
.percent-track {
  flex: 1; height: 8px; background: rgba(20,17,13,0.12);
  border-radius: 4px; overflow: hidden;
}
.percent-fill {
  height: 100%; width: 0%; border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
}
.percent-value { width: 42px; text-align: right; font-size: 0.9rem; font-weight: 700; flex-shrink: 0; }

.result-title { font-size: 1.7rem; margin-bottom: 12px; }
.result-desc { line-height: 1.7; margin-bottom: 24px; }

.stamp-wrap {
  position: absolute; right: 12px; bottom: 12px; width: 110px; height: 110px;
  opacity: 0; transform: scale(1.8) translateY(-20px); pointer-events: none;
}
.stamp-wrap.active { animation: stampPress 0.7s cubic-bezier(0.21, 0.98, 0.22, 0.99) forwards; }
@keyframes stampPress {
  0% { opacity: 0; transform: scale(1.8) translateY(-20px); }
  40% { opacity: 1; transform: scale(1.1) translateY(4px); }
  65% { transform: scale(0.92) translateY(-2px); }
  80% { transform: scale(1.02) translateY(1px); }
  100% { opacity: 1; transform: scale(1) translateY(0px); }
}

.restart-btn-wrap { margin-top: 40px; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 360px) {
  body { padding: 16px 12px; }
  .photo-card { padding: 22px 16px 28px; }
  .result-title { font-size: 1.4rem; }
  .character-area { max-width: 210px; }
  .stamp-wrap { width: 90px; height: 90px; }
  .percent-label { width: 72px; font-size: 0.85rem; }
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="container">

  <div class="view home-view active" id="home">
    <h1 class="title-font">心理暗房</h1>
    <p class="subtitle mono-font">PSYCHO DARKROOM · 曝光你的心理底片</p>

    <div class="home-desc">
      <p>心理如同未曝光的胶片。</p>
      <p>每一道问题，都是一次精准曝光。</p>
      <p>完成10道底片测试，解锁你的专属心理人格画像。</p>
    </div>

    <div class="dimension-desc">
      <div class="dimension-item">
        <span class="dimension-tag" style="background: var(--safe-light-red);"></span>
        <span><strong>理性底片</strong>：冷静克制、逻辑优先、擅长掌控秩序与节奏</span>
      </div>
      <div class="dimension-item">
        <span class="dimension-tag" style="background: var(--developer-green);"></span>
        <span><strong>共情底片</strong>：细腻敏感、擅长共情、包容他人情绪与感受</span>
      </div>
      <div class="dimension-item">
        <span class="dimension-tag" style="background: var(--fixing-gold);"></span>
        <span><strong>随性底片</strong>：松弛自由、适应性强、不被规则与执念束缚</span>
      </div>
    </div>

    <button class="btn mono-font" id="startBtn">开始曝光测试</button>
  </div>

  <div class="view question-view" id="question">
    <div class="exposure-meter-wrap">
      <div class="exposure-label mono-font">
        <span>曝光计</span>
        <span id="progressText">0 / 10</span>
      </div>
      <div class="exposure-meter">
        <div class="exposure-fill" id="exposureFill"></div>
      </div>
    </div>

    <p class="frame-number mono-font" id="frameNo">胶片帧 #01</p>
    <h2 class="question-title title-font" id="questionText"></h2>
    <div class="option-list" id="optionList"></div>
  </div>

  <div class="view develop-view" id="develop">
    <p class="develop-text title-font">正在显影底片...</p>
    <div class="develop-loader">
      <div class="develop-bar"></div>
    </div>
    <p class="mono-font" style="margin-top:16px;color:#aaa;">等待冲印心理鉴定报告</p>
  </div>

  <div class="view result-view" id="result">
    <div class="photo-card">
      <span class="corner-1"></span>
      <span class="corner-2"></span>

      <div class="character-area" id="characterArea"></div>

      <div class="percent-group" id="percentGroup">
        <div class="percent-item">
          <span class="percent-label" style="color:var(--safe-light-red)">理性底片</span>
          <div class="percent-track">
            <div class="percent-fill" id="percentA" style="background:var(--safe-light-red)"></div>
          </div>
          <span class="percent-value" id="percentValueA">0%</span>
        </div>
        <div class="percent-item">
          <span class="percent-label" style="color:var(--developer-green)">共情底片</span>
          <div class="percent-track">
            <div class="percent-fill" id="percentB" style="background:var(--developer-green)"></div>
          </div>
          <span class="percent-value" id="percentValueB">0%</span>
        </div>
        <div class="percent-item">
          <span class="percent-label" style="color:var(--fixing-gold)">随性底片</span>
          <div class="percent-track">
            <div class="percent-fill" id="percentC" style="background:var(--fixing-gold)"></div>
          </div>
          <span class="percent-value" id="percentValueC">0%</span>
        </div>
      </div>

      <h2 class="result-title title-font" id="resultTitle"></h2>
      <p class="result-desc" id="resultDesc"></p>

      <div class="stamp-wrap" id="stamp">
        <svg viewBox="0 0 100 100">
          <defs>
            <path id="circlePath" fill="none" d="M 50,50 m -40,0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0"/>
          </defs>
          <circle cx="50" cy="50" r="36" fill="none" stroke="#C1432A" stroke-width="2.2"/>
          <text font-size="9" fill="#C1432A" letter-spacing="0.06em">
            <textPath href="#circlePath">心理暗房 · 鉴定有效</textPath>
          </text>
          <circle cx="50" cy="50" r="6" fill="#C1432A"/>
        </svg>
      </div>
    </div>

    <div class="restart-btn-wrap">
      <button class="btn mono-font" id="restartBtn">重新拍摄底片</button>
    </div>
  </div>

</div>

<script>
const questions = [
  { frame: "#01", q: "面对突发意外打乱计划，你会？", options: [
    { text: "立刻梳理问题，快速制定新方案", score: { A: 2, B: 0, C: 1 } },
    { text: "担心影响他人，优先照顾别人感受", score: { A: 0, B: 2, C: 1 } },
    { text: "顺其自然，接受变化、随心调整", score: { A: 1, B: 0, C: 2 } }
  ]},
  { frame: "#02", q: "与人产生分歧时，你的处事方式是？", options: [
    { text: "讲道理摆逻辑，对错优先", score: { A: 2, B: 0, C: 1 } },
    { text: "换位思考，主动包容化解矛盾", score: { A: 0, B: 2, C: 1 } },
    { text: "懒得争执，随对方想法即可", score: { A: 1, B: 0, C: 2 } }
  ]},
  { frame: "#03", q: "空闲独处时，你更享受哪种状态？", options: [
    { text: "复盘梳理生活、规划后续事务", score: { A: 2, B: 1, C: 0 } },
    { text: "沉浸情绪、治愈自我、放空内心", score: { A: 1, B: 2, C: 0 } },
    { text: "随心所欲躺平、无目的放松", score: { A: 0, B: 1, C: 2 } }
  ]},
  { frame: "#04", q: "做重大决定时，你更依赖？", options: [
    { text: "数据、经验、逻辑推演", score: { A: 2, B: 0, C: 1 } },
    { text: "内心感受、直觉与本心", score: { A: 0, B: 2, C: 1 } },
    { text: "随缘选择、不纠结不内耗", score: { A: 1, B: 0, C: 2 } }
  ]},
  { frame: "#05", q: "看到他人难过低落，你会？", options: [
    { text: "理性分析原因，给出解决办法", score: { A: 2, B: 1, C: 0 } },
    { text: "感同身受，主动安慰陪伴", score: { A: 1, B: 2, C: 0 } },
    { text: "保持距离，不主动介入情绪", score: { A: 0, B: 1, C: 2 } }
  ]},
  { frame: "#06", q: "对待生活规则与约束，你的态度？", options: [
    { text: "严格遵守，敬畏秩序、自律性强", score: { A: 2, B: 0, C: 1 } },
    { text: "灵活变通，兼顾人情与规则", score: { A: 1, B: 2, C: 0 } },
    { text: "不喜束缚，随心而为", score: { A: 0, B: 1, C: 2 } }
  ]},
  { frame: "#07", q: "遭遇压力挫折，你会如何应对？", options: [

// 通用外发光滤镜 & 舞台装饰

      <stop offset="100%" stop-color="#FFF4E2" stop-opacity="0"/>

    <linearGradient id="eyeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softInk" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.1" flood-color="#2A231A" flood-opacity=".22"/>
    </filter>
  </defs>`;

// 背景层（舞台 + 星空 + 花瓣 + 光晕），c1/c2 为主题色
function bgLayer(c1, c2) {
  return `

  <ellipse cx="130" cy="222" rx="72" ry="16" fill="${c1}" opacity=".12" class="ch-glowpulse"/>

  <!-- 大四芒星（呼吸闪亮） -->

    <path d="M50 60 l2.6 8.4 8.4 2.6 -8.4 2.6 -2.6 8.4 -2.6 -8.4 -8.4 -2.6 8.4 -2.6z"/>

// 表情：眼（含高光+眨眼+视线游移）
function eyes(type, c) {
  if (type === "closed") {
    return `
      <path d="M92 128 q8 7 16 0" stroke="#3A2F26" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M152 128 q8 7 16 0" stroke="#3A2F26" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
  if (type === "happy") {
    return `
      <path d="M92 132 q8 -10 16 0" stroke="#3A2F26" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M152 132 q8 -10 16 0" stroke="#3A2F26" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  }
  // 默认大眼：眼底渐变 + 竖瞳 + 双高光
  const eye = (cx) => `

    </g>`;
  return `<g class="ch-eyes">${eye(100)}${eye(160)}</g>`;
}

// 眉毛 (mood: calm/serious/gentle/soft)
function brows(mood, col) {
  const c = col || "#4A3A2E";
  if (mood === "serious") {
    return `<path d="M88 112 l22 5" stroke="${c}" stroke-width="3" stroke-linecap="round"/>
            <path d="M172 112 l-22 5" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;

  if (mood === "gentle") {
    return `<path d="M88 114 q11 -8 22 0" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M172 114 q-11 -8 -22 0" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
  if (mood === "soft") {
    return `<path d="M88 113 q11 -5 22 1" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M172 113 q-11 -5 -22 1" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

  return `<path d="M88 113 q11 -3 22 2" stroke="${c}" stroke-width="2.8" fill="none" stroke-linecap="round"/>

}

// 腮红
function cheeks(c, wide) {
  const x1 = wide ? 84 : 88, x2 = wide ? 176 : 172;
  return `
  <ellipse class="ch-cheek" cx="${x1}" cy="146" rx="10" ry="5.6" fill="${c}" opacity=".5"/>
  <ellipse class="ch-cheek" cx="${x2}" cy="146" rx="10" ry="5.6" fill="${c}" opacity=".5"/>`;
}

// 嘴 (smile/small/open/calm)
function mouth(type) {
  if (type === "open") {
    return `<path d="M124 160 q6 9 12 0 q-6 3 -12 0z" fill="#8E3A34" stroke="#4A3A2E" stroke-width="1.8" stroke-linejoin="round"/>`;

  if (type === "calm") {
    return `<path d="M125 160 q5 3 10 0" stroke="#4A3A2E" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;

  if (type === "small") {
    return `<path d="M126 159 q4 5 8 0" stroke="#4A3A2E" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }
  return `<path d="M122 158 q8 8 16 0" stroke="#4A3A2E" stroke-width="2.3" fill="none" stroke-linecap="round"/>`;
}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let currentIndex = 0;
let score = { A: 0, B: 0, C: 0 };
let isAnswering = false;

function switchView(el) {
  $$(".view").forEach(v => v.classList.remove("active"));
  requestAnimationFrame(() => el.classList.add("active"));
}

function calcResultKey() {
  const sorted = Object.entries(score).sort((a, b) => b[1] - a[1]);
  const [first, second, third] = sorted;
  const threshold = 2;

  if (Math.abs(first[1] - second[1]) <= threshold) {
    if (Math.abs(second[1] - third[1]) <= threshold) {
      return "ABC";
    }
    return first[0] + second[0];
  }
  return first[0];
}

function renderQuestion() {
  const item = questions[currentIndex];
  $("#frameNo").textContent = `胶片帧 ${item.frame}`;
  $("#questionText").textContent = item.q;
  $("#progressText").textContent = `${currentIndex + 1} / ${questions.length}`;
  $("#exposureFill").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

  const optWrap = $("#optionList");
  optWrap.innerHTML = "";

  item.options.forEach(opt => {
    const div = document.createElement("div");
    div.className = "option-item";
    div.tabIndex = 0;
    div.textContent = opt.text;
    div.onclick = () => selectAnswer(opt.score);
    div.onkeydown = e => { if (e.key === "Enter") selectAnswer(opt.score); };
    optWrap.appendChild(div);
  });

  isAnswering = false;
}

function selectAnswer(s) {
  if (isAnswering) return;
  isAnswering = true;

  score.A += s.A; score.B += s.B; score.C += s.C;
  currentIndex++;

  if (currentIndex >= questions.length) {
    switchView($("#develop"));
    setTimeout(() => {
      renderResult();
      switchView($("#result"));
      requestAnimationFrame(() => {
        setTimeout(() => $("#stamp").classList.add("active"), 400);
      });
    }, 2000);
  } else {
    renderQuestion();
  }
}

function renderResult() {
  const resultKey = calcResultKey();
  const res = resultPool.find(item => item.key === resultKey);

  // 重新插入，确保 SVG 内动画与入场动画从头播放
  const area = $("#characterArea");
  area.innerHTML = "";
  void area.offsetWidth;
  area.innerHTML = characterMap[resultKey];

  $("#resultTitle").textContent = res.title;
  $("#resultDesc").textContent = res.desc;

  const total = score.A + score.B + score.C || 1;
  const percentA = Math.round((score.A / total) * 100);
  const percentB = Math.round((score.B / total) * 100);
  const percentC = Math.round((score.C / total) * 100);

  $("#percentValueA").textContent = percentA + "%";
  $("#percentValueB").textContent = percentB + "%";
  $("#percentValueC").textContent = percentC + "%";

  requestAnimationFrame(() => {
    $("#percentA").style.width = percentA + "%";
    $("#percentB").style.width = percentB + "%";
    $("#percentC").style.width = percentC + "%";
  });
}

$("#startBtn").onclick = () => {
  currentIndex = 0;
  score = { A: 0, B: 0, C: 0 };
  $("#characterArea").innerHTML = "";
  $("#stamp").classList.remove("active");
  $("#percentA").style.width = "0%";
  $("#percentB").style.width = "0%";
  $("#percentC").style.width = "0%";
  renderQuestion();
  switchView($("#question"));
};

$("#restartBtn").onclick = () => {
  $("#characterArea").innerHTML = "";
  $("#stamp").classList.remove("active");
  $("#percentA").style.width = "0%";
  $("#percentB").style.width = "0%";
  $("#percentC").style.width = "0%";
  switchView($("#home"));
};
</script>
